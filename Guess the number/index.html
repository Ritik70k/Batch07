<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Guess the number(Between 1 to 6)</h1>
    <input type="number" min="1" max="6" id="input" placeholder="Enter a number">
    <span id="right">Congrats! You guessed it right...</span>
    <span id="wrong">Oops! You guessed it wrong...</span>
    <div class="res-score">
        <p>you: <span id="you"></span></p>
        <p>computer: <span id="comp"></span></p>
    </div>
    <div class="btn-cont">
        <div class="btn" id="check">Check Answer</div>
        <div class="btn" id="reset">Reset Game</div>
    </div>
</body>
</html>
