<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED Editor</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        html, body{
            width: 100%;
            height: 100%;
            background-color: #222;
            color:#dadada;
        }
        .card{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 400px;
            background-color: #333;
            border-radius: 20px;
        }
        .card img{
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }
        .card h2{
            font-size: 40px;
            margin: 10px 0;
        }
        .card p{
            text-transform: uppercase;
            font-size: 17px;
            margin: 10px 0;
        }
        .info{
            padding:10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button{
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 20px;
            background-color: #153adb;
            border: none;
            border-radius: 5px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1740252117044-2af197eea287?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fGF2YXRhcnxlbnwwfHwwfHx8MA%3D%3D" alt="">
        <div class="info">
            <h2>Ritik Kumar</h2>
            <p>Web Developer</p>
        </div>
        <button>Change Role</button>
    </div>
    
    <script>
        const btn = document.querySelector("button");
        const role = document.querySelector("p");

        const roles = [
            "Web Developer",
            "Web Designer",
            "UI/UX Designer",
            "Frontend Developer",
            "Mern Developer"
         ];
         btn.addEventListener("click", ()=>{
            const random = Math.floor(Math.random()*roles.length);
            role.innerText = roles[random];
            role.style.color = "#b5e40b"
         })
    </script>
</body>
</html>
